    analytics_state_signal: Google cookie 已关闭：你的浏览器发送了 Global Privacy Control 或 Do Not Track。
    analytics_state_granted: 你已在此浏览器中允许 Google cookie。
    analytics_state_denied: 你已在此浏览器中关闭 Google cookie。
    analytics_state_default: 你尚未在此浏览器中做出选择。
    privacy_choices: 隐私选项
    footer_links_aria: 网站信息
    footer_about: 关于
    footer_contact: 联系
    footer_privacy: 隐私
    article_nav_aria: 本领域的更多文章
    article_nav_all: 查看全部文章：
    article_nav_prev: 上一篇
    article_nav_next: 下一篇
    ad_label: 广告
    popup_close: 关闭
    popup_title: 获取更新
    popup_text: 获取 AI、基础设施和工程实践的新文章。不会发送垃圾邮件。
    popup_email: your@email.com
    popup_subscribe: 订阅
    popup_skip: 暂不需要
    popup_success: 订阅成功，欢迎加入。
    popup_network_error: 网络错误，请重试。
    popup_generic_error: 发生错误，请稍后重试。

plugins:
  - search:
      lang: zh

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
