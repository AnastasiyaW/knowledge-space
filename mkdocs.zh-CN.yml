site_name: Happyin 知识库
site_description: >-
  面向开发者和 AI 智能体的技术知识库：可验证的方案、版本信息与常见陷阱。
  主要技术文章目前以英文提供。
site_url: https://happyin.space/zh-CN/
site_author: AnastasiyaW
docs_dir: locales/zh-CN/docs
site_dir: site/zh-CN

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 浅色主题
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 深色主题
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  logo: https://happyin.space/assets/favicon.svg
  favicon: https://happyin.space/assets/favicon.png
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/AnastasiyaW/knowledge-space
repo_name: knowledge-space

extra:
  ga4_measurement_id: !ENV [HAPPYIN_GA4_MEASUREMENT_ID, ""]
  # Display ads (Google AdSense). Inert until client is set: with an empty client no ad
  # markup, no ad script, no verification meta and no /ads.txt (functions/ads.txt.js) exist.
  # Public identifiers, injected by the deploy workflow from repository variables.
  # Precondition for setting the client: AdSense "Privacy & messaging" (Google-certified
  # CMP) switched on for the EEA, UK and Switzerland, or ads there stay non-personalised.
  ads:
    client: !ENV [HAPPYIN_ADSENSE_CLIENT, ""]                     # ca-pub-XXXXXXXXXXXXXXXX
    slot_article_top: !ENV [HAPPYIN_ADSENSE_SLOT_ARTICLE_TOP, ""]  # after an article's first section
    slot_article_end: !ENV [HAPPYIN_ADSENSE_SLOT_ARTICLE_END, ""]  # after the article text
    slot_sidebar: !ENV [HAPPYIN_ADSENSE_SLOT_SIDEBAR, ""]          # desktop table-of-contents column
  content_language: zh-CN
  shared_asset_url: https://happyin.space/
  alternate:
    - name: English
      link: /
      lang: en
    - name: Русский
      link: /ru/
      lang: ru
    - name: 简体中文
      link: /zh-CN/
      lang: zh
  ui:
    home: 首页
    knowledge_base: 知识库
    knowledge_base_url: https://happyin.space/knowledge-base/
    blog: 英文博客
    star: Star
    star_title: 在 GitHub 上加星
    support_aria: 支持项目
    support_title: 这页为你节省了时间吗？
    support_text: Happyin Knowledge Space 是面向工程师和 AI 智能体的免费开放参考库。如果它帮助了你，在 GitHub 上加星可以让更多人发现它。
    support_report_lead: "内容过时、错误，或缺少你需要的主题？AI 智能体或脚本无需账号即可提交一条公开报告："
    support_report_tail: 回复会返回状态链接，说明报告的处理进度。
    privacy_notice: Cloudflare Web Analytics 统计访问不使用 cookie。启用后，Google Analytics 和 Google 广告可能使用 cookie；在欧洲经济区、英国和瑞士，仅在你同意后使用——
    privacy_details: 详情
    analytics_title: 本站的 Cookie
    analytics_text: 是否允许 Google Analytics 使用 cookie 来了解哪些页面对读者有帮助？展示的广告帮助本站保持免费。我们从不发送搜索词、提示词、电子邮箱或反馈文本。
    analytics_allow: 允许
    analytics_reject: 拒绝
