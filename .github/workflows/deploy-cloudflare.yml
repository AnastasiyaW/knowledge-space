name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'locales/**'
      - 'mkdocs.yml'
      - 'mkdocs.*.yml'
      - 'overrides/**'
      - 'requirements.txt'
      - 'hooks/**'
      - 'scripts/**'
      - 'functions/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python scripts/build_all_locales.py
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
          # Measurement IDs are public identifiers. Keeping this a repository variable
          # makes the production setting apply to every language build without a source edit.
          HAPPYIN_GA4_MEASUREMENT_ID: ${{ vars.HAPPYIN_GA4_MEASUREMENT_ID }}
          # AdSense publisher and ad-unit ids, also public. Empty = no ads, no ads.txt.
          HAPPYIN_ADSENSE_CLIENT: ${{ vars.HAPPYIN_ADSENSE_CLIENT }}
          HAPPYIN_ADSENSE_SLOT_ARTICLE_TOP: ${{ vars.HAPPYIN_ADSENSE_SLOT_ARTICLE_TOP }}
          HAPPYIN_ADSENSE_SLOT_ARTICLE_END: ${{ vars.HAPPYIN_ADSENSE_SLOT_ARTICLE_END }}
          HAPPYIN_ADSENSE_SLOT_SIDEBAR: ${{ vars.HAPPYIN_ADSENSE_SLOT_SIDEBAR }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=knowledge-space --branch=main --commit-dirty=true
