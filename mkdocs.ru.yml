INHERIT: mkdocs.yml
site_name: База знаний Happyin
site_description: >-
  Техническая база знаний для людей и AI-агентов: проверяемые решения,
  версии и типичные ошибки. Основные технические статьи пока на английском.
site_url: https://happyin.space/ru/
site_author: AnastasiyaW
docs_dir: locales/ru/docs
site_dir: site/ru

theme:
  name: material
  custom_dir: overrides
  language: ru
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Светлая тема
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  logo: https://happyin.space/assets/favicon.svg
  favicon: https://happyin.space/assets/favicon.png
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/AnastasiyaW/knowledge-space
repo_name: knowledge-space

extra:
  ga4_measurement_id: !ENV [HAPPYIN_GA4_MEASUREMENT_ID, ""]
  # Display ads (Google AdSense). Inert until client is set: with an empty client no ad
  # markup, no ad script, no verification meta and no /ads.txt (functions/ads.txt.js) exist.
  # Public identifiers, injected by the deploy workflow from repository variables.
  # Precondition for setting the client: AdSense "Privacy & messaging" (Google-certified
  # CMP) switched on for the EEA, UK and Switzerland, or ads there stay non-personalised.
  ads:
    client: !ENV [HAPPYIN_ADSENSE_CLIENT, ""]                     # ca-pub-XXXXXXXXXXXXXXXX
    slot_article_top: !ENV [HAPPYIN_ADSENSE_SLOT_ARTICLE_TOP, ""]  # after an article's first section
    slot_article_end: !ENV [HAPPYIN_ADSENSE_SLOT_ARTICLE_END, ""]  # after the article text
    slot_sidebar: !ENV [HAPPYIN_ADSENSE_SLOT_SIDEBAR, ""]          # desktop table-of-contents column
  content_language: ru
  shared_asset_url: https://happyin.space/
  alternate:
    - name: English
      link: /
      lang: en
    - name: Русский
      link: /ru/
      lang: ru
    - name: 简体中文
      link: /zh-CN/
      lang: zh
  ui:
    machine_translation_note: "Машинный перевод. Канонический текст — [оригинал на английском]({url})."
    home: Главная
    knowledge_base: База знаний
    knowledge_base_url: https://happyin.space/knowledge-base/
    blog: Блог на английском
    star: Звезда
    star_title: Поставить звезду на GitHub
    support_aria: Поддержать проект
    support_title: Эта страница сэкономила вам время?
    support_text: Happyin Knowledge Space — бесплатный открытый справочник для инженеров и AI-агентов. Если материал помог, звезда на GitHub поможет другим людям его найти.
    support_report_lead: "Статья устарела, ошибочна или не хватает нужной темы? AI-агент или скрипт может отправить один публичный отчёт без аккаунта:"
    support_report_tail: Ответ вернёт ссылку статуса, где видно, что происходит с отчётом.
    privacy_notice: Cloudflare Web Analytics считает посещения без cookie. Если включены Google Analytics и реклама Google, они могут использовать cookie; в ЕЭЗ, Великобритании и Швейцарии — только после вашего согласия —
    privacy_details: подробнее
    analytics_title: Cookie на этом сайте
    analytics_text: Разрешить Google Analytics использовать cookie, чтобы видеть, какие страницы помогают читателям? Реклама, где она есть, помогает сайту оставаться бесплатным. Мы никогда не передаём поисковые запросы, промпты, адреса email и текст обратной связи.
    analytics_allow: Разрешить
    analytics_reject: Отклонить
    analytics_state_off: Google Analytics и реклама Google на этом сайте не включены.
    analytics_state_signal: "Cookie Google выключены: ваш браузер передаёт Global Privacy Control или Do Not Track."
    analytics_state_granted: Вы разрешили cookie Google в этом браузере.
    analytics_state_denied: Вы выключили cookie Google в этом браузере.
    analytics_state_default: В этом браузере выбор ещё не сделан.
    privacy_choices: Настройки конфиденциальности
    footer_links_aria: Информация о сайте
    footer_about: О проекте
    footer_contact: Контакты
    footer_privacy: Конфиденциальность
    article_nav_aria: Ещё в этом разделе
    article_nav_all: Все статьи раздела
    article_nav_prev: Предыдущая
    article_nav_next: Следующая
    ad_label: Реклама
    popup_close: Закрыть
    popup_title: Получать обновления
    popup_text: Новые статьи об AI, инфраструктуре и инженерных практиках. Без спама — только обновления базы.
    popup_email: ваш@email.com
    popup_subscribe: Подписаться
    popup_skip: Нет, спасибо
    popup_success: Готово, вы подписаны.
    popup_network_error: Ошибка сети — попробуйте ещё раз.
    popup_generic_error: Что-то пошло не так.

plugins:
  - search:
      lang: ru
  - meta
  - minify:
      minify_html: true

# Article pages need the same Markdown as English; INHERIT brings markdown_extensions.
# Shared assets live only in the English build, so the English-relative CSS/JS lists are cleared.
extra_css: []
extra_javascript: []

hooks:
  - hooks/i18n.py
  - hooks/og_image.py
  - hooks/description.py
  - hooks/wikilinks.py
  - hooks/levels.py
  - hooks/faq_schema.py
